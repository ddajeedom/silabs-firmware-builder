
name: SAV GP - Compilation test

'on':
  push:
    branches:
      - sav-gp-test
    paths:
      - "src/zigbee_router/**"
      - "manifests/sonoff/**"
      - ".github/workflows/sav-gp-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v4

      - name: Preparer le diagnostic
        run: |
          mkdir -p diagnostic-gp
          echo "Firmware experimental - NE PAS FLASHER" \
            > diagnostic-gp/NE_PAS_FLASHER.txt

      - name: Recuperer le compilateur Silicon Labs
        env:
          BUILD_HASH: ${{ hashFiles('Dockerfile', 'requirements.txt') }}
        run: |
          set -euo pipefail
          TAG="${BUILD_HASH:0:16}"
          IMAGE="ghcr.io/nerivec/silabs-firmware-builder:$TAG"
          echo "Image utilisee : $IMAGE"
          docker pull "$IMAGE"
          echo "SAV_BUILD_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Examiner la structure CLI du SDK
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            --entrypoint /bin/sh \
            "$SAV_BUILD_IMAGE" -c '
              set -eu

              FILE=$(find /root/.silabs \
                -name sl_cli_types.h -print -quit)

              if [ -z "$FILE" ]; then
                echo "ERREUR : sl_cli_types.h introuvable"
                exit 1
              fi

              echo "=== FICHIER SDK ==="
              echo "$FILE"

              echo "=== DEFINITION CLI ==="
              grep -n -B 45 -A 15 \
                "sl_cli_command_info_t" "$FILE"
            ' 2>&1 | tee diagnostic-gp/structure-cli.log

      - name: Compiler SONOFF Green Power
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            --entrypoint /bin/sh \
            "$SAV_BUILD_IMAGE" -c '
              set -eu
              /opt/venv/bin/python3 tools/build_project.py \
                --manifest manifests/sonoff/sonoff_zbdonglee_zigbee_router.yaml \
                --build-dir build \
                --output-dir outputs \
                --output gbl \
                --output out \
                --repo-owner ddajeedom \
                --repo-hash "$(git rev-parse --short=8 HEAD)"
            ' 2>&1 | tee diagnostic-gp/compilation.log

      - name: Enregistrer les resultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SAV-GP-COMPILATION-TEST
          path: |
            diagnostic-gp/
            outputs/
          if-no-files-found: warn
          retention-days: 14
