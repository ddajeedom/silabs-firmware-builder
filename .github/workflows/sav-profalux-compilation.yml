name: SAV Profalux - Compiler SONOFF routeur ZDO

'on':
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Recupere le depot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

