      - name: Compiler dans l image SILABS deja utilisee lors du build precedent
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/nerivec/silabs-firmware-builder@sha256:d376f63d95a0efc11f51623ccef2aa9a280eb565e283a634e5a533597870a0cb"
          docker pull "$image"
          docker image inspect "$image" --format "{{json .RepoDigests}}" > sav-resultats/image.json
          docker run --rm \
            -e GITHUB_REPOSITORY_OWNER="$GITHUB_REPOSITORY_OWNER" \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo --entrypoint /bin/sh "$image" -c '
              set -eu
              /opt/venv/bin/python3 tools/build_project.py \
                --manifest manifests/sonoff/sonoff_zbdonglee_zigbee_router.yaml \
                --build-dir build --output-dir outputs \
                --output gbl --output out \
                --repo-owner "$GITHUB_REPOSITORY_OWNER" --repo-hash "$(git rev-parse --short=8 HEAD)"
          ' 2>&1 | tee sav-resultats/compilation.log
          cp outputs/*.gbl outputs/*.out sav-resultats/
          sha256sum sav-resultats/*.gbl > sav-resultats/SHA256SUMS.txt
          # A presence de la nouvelle CLI dans le binaire est indispensable.
          strings sav-resultats/*.out | grep -Fqx "sav-tc-info"
          strings sav-resultats/*.out | grep -Fqx "sav-tc-pjoin"
          printf "%s\n" "COMPILATION EXPERIMENTALE UNIQUEMENT - NE PAS FLASHER AVANT VALIDATION." > sav-resultats/NE_PAS_FLASHER.txt

      - name: Conserver les logs et le firmware meme en cas dechec
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SAV-PROFALUX-ZDO-120-240-A-VERIFIER
          path: sav-resultats/
          if-no-files-found: warn
          retention-days: 14
